[package]
name = "mrledger"
description = "Somewhere to keep your secrets!"
version = "1.0.1"
edition = "2024"
homepage = "https://github.com/mustafaelrasheid/mrledger"
repository = "https://github.com/mustafaelrasheid/mrledger"
license = "MIT"
keywords = ["cli", "secrets", "vault", "encryption"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
dialoguer = "0.12.0"
inquire = "0.9.4"
rand = "0.8.0"
rsa = "0.9.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.0"
typenum = "1.20.0"
